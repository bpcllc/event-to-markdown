<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event to Markdown</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f1f1f;
      --muted: #616161;
      --border: #d1d1d1;
      --field: #fafafa;
      --accent: #0f6cbd;
      --accent-fg: #ffffff;
      --ok: #107c10;
      --warn: #a4262c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1f1f;
        --fg: #f0f0f0;
        --muted: #adadad;
        --border: #444444;
        --field: #2a2a2a;
        --accent: #479ef5;
        --accent-fg: #0b0b0b;
        --ok: #54b054;
        --warn: #f1707b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    legend { font-weight: 600; margin-bottom: 4px; padding: 0; }
    label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    textarea {
      flex: 1;
      min-height: 220px;
      width: 100%;
      resize: vertical;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--field);
      color: var(--fg);
      font: 12.5px/1.45 Consolas, "Cascadia Mono", ui-monospace, monospace;
      white-space: pre;
      overflow: auto;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      font: inherit;
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #status { font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
    #status.ok { color: var(--ok); }
    #status.warn { color: var(--warn); }
    .hint { font-size: 12px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <fieldset>
    <legend>Format</legend>
    <label><input type="radio" name="format" value="markdown" checked> Markdown</label>
    <label><input type="radio" name="format" value="text"> Plain text</label>
  </fieldset>

  <fieldset>
    <legend>Include</legend>
    <label><input type="checkbox" id="optAttendees" checked> Attendees</label>
    <label><input type="checkbox" id="optResponses" checked> Responses</label>
    <label><input type="checkbox" id="optUtc" checked> UTC times</label>
    <label><input type="checkbox" id="optBody" checked> Notes / body</label>
  </fieldset>

  <textarea id="output" spellcheck="false" aria-label="Event text">Loading event…</textarea>

  <div class="row">
    <button id="copy" class="primary" type="button">Copy</button>
    <button id="refresh" type="button">Reload</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <p class="hint">You can edit the text before copying. If Copy is blocked, the text is left selected — press Ctrl+C.</p>

  <script src="taskpane.js"></script>
</body>
</html>
